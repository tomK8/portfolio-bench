spring.application.name=portfolio-bench
# Optional local secrets/overrides, loaded from the home directory — OUTSIDE this repo, so a
# Gmail app password kept here can never be committed. Absent by default (optional:). Put mail
# settings (portfolio.alert.mail.*) in ~/.portfolio-bench.properties to enable alerts.
spring.config.import=optional:file:${user.home}/.portfolio-bench.properties
# Single-user local tool: bind to loopback only, no auth.
server.address=127.0.0.1
server.port=8080
# Local dev tool — pick up template edits without a restart.
spring.thymeleaf.cache=false
# Daemonised: route the startup banner through the logger so it lands in the log file.
spring.main.banner-mode=log
# Use virtual threads for all Spring MVC request handling (Java 21+).
spring.threads.virtual.enabled=true
# Spring's default scheduler pool is ONE thread, which every @Scheduled method in
# PriceFetchScheduler then has to share. The intraday pass walks ~106 tickers at a 500ms
# throttle (~70s, and far longer when Yahoo starts timing out at 20s a request) against a 60s
# fixedDelay, so that thread is saturated essentially all the time — and on 2026-08-19 the
# 22:00 daily cron never got it. The daily bar for that session stayed frozen at the
# mid-session snapshot the startup run had written (MRNA: 155.51 against a real 174.38 close),
# which is what fed the Live tab's wrong Day Δ. One thread per job kind, so a slow fetch can
# never starve the cron that repairs the day's closes.
spring.task.scheduling.pool.size=4

# Watchlist alert emails (off by default). To enable Gmail delivery: create a Google
# app password (Account > Security > App passwords), then set enabled=true and fill in
# username/password/from/to. Keep the app running during market hours (lid open + caffeinate)
# for alerts to fire. Prefer overriding these in a local, untracked properties file rather
# than committing your app password here.
portfolio.alert.mail.enabled=false
portfolio.alert.mail.host=smtp.gmail.com
portfolio.alert.mail.port=587
portfolio.alert.mail.starttls=true
portfolio.alert.mail.username=
portfolio.alert.mail.password=
portfolio.alert.mail.from=
portfolio.alert.mail.to=
