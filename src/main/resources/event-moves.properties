# Scheduled-event move sizes for the open-orders touch model (Stage 3, behind useEventVar).
#
# Diffusive volatility cannot see a date in the calendar. A name that has been quiet for twenty
# sessions and reports next month will not stay quiet, and RV20 has no way to know that — so a
# scheduled event is added as *variance*, not as volatility:
#
#     totalVar  = var_N × N + Σ eventMove²   (events falling inside the horizon)
#     sigma_eff = √(totalVar / N)
#
# Holds only judgements — a typical absolute one-day move on the print, as a fraction. Nothing here
# drifts with the market, and no dates live here: those come from the earnings calendar cache.

# Default for a single-name equity: a 6% move on the day of the print.
default.equity=0.06

# Funds, bullion ETCs and gilts have no scheduled event at all, so they contribute no variance.
# They are also absent from the earnings feed, so this is belt-and-braces rather than the only
# guard — a symbol with no dates adds nothing whatever its move size says.
default.fund=0.00
default.other=0.00

# override.<SYMBOL> — for names whose prints are reliably bigger or smaller than the default.
# Deliberately empty on day one: every entry here is a claim about a specific company that has to
# be earned from its own history, and a guessed override is worse than the default it replaces.
