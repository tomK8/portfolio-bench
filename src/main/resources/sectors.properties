# Sector taxonomy. Deliberately holds only *judgements* — nothing here drifts with the market.
#
# Fund sector weights are NOT configured here. They are fetched live from Yahoo's topHoldings
# module alongside the rest of the fundamentals snapshot (zero extra HTTP calls, since those
# funds are already being fetched) and refreshed by FundamentalsFetchJob. A hand-written weight
# table was rejected: it would have been wrong on day one, not merely stale later — MCTS reads
# as a semiconductor fund by name but is 29.8% tech / 23.4% consumer / 18.6% comms (Tencent,
# Alibaba, CATL), and EQQQ is 57.8% tech, not the ~100% an eyeball guess suggests.

# override.<SYMBOL> — for instruments Yahoo has no sector for and never will. Physical-metal
# ETCs hold bullion, so they have neither a sector nor fund sector-weightings; without an entry
# they would land in UNCLASSIFIED and nag from the warning strip forever.
override.PHGP=COMMODITIES
override.GBS=COMMODITIES
override.SGBX=COMMODITIES
override.VGOV=FIXED_INCOME

# AI/Tech axis — the second, orthogonal view. A name qualifies automatically if its Yahoo sector
# is Technology; this list adds the agreed exceptions, all of which GICS files elsewhere:
# the mega-cap internet names (Alphabet/Meta/Amazon/Netflix sit in Communication Services or
# Consumer Cyclical), plus TSLA and BABA.
# Deliberately excluded: V/MA (payments, classified Financials) and LSEG/REL (data & analytics).
aitech.include=GOOG,GOOGL,META,AMZN,NFLX,TSLA,BABA

# ---------------------------------------------------------------------------------------------
# Industry groups — the sector drill-down's second level. Read by domain/IndustryGroups.
#
# Yahoo's own industry strings are finer-grained than anyone reads a portfolio at: Financials
# arrives as six industries, splitting four banks and three insurers into groups of one and two.
# These keys collapse them. Unmapped industries fall through to their raw Yahoo name, so a new
# industry shows up as its own one-row group rather than being absorbed into an "Other" bin.
#
# Keys are slugs: lowercase, runs of non-alphanumerics collapsed to one hyphen. One key therefore
# matches "Banks - Diversified", "Banks-Diversified" and "Banks — Diversified" — Yahoo has used
# the hyphen and the em dash for the same industry.

# Banks
industry.group.banks-diversified=Banks
industry.group.banks-regional=Banks

# Insurance — every Yahoo variant, so the group survives a holding switching sub-type
industry.group.insurance-diversified=Insurance
industry.group.insurance-life=Insurance
industry.group.insurance-property-casualty=Insurance
industry.group.insurance-reinsurance=Insurance
industry.group.insurance-specialty=Insurance
industry.group.insurance-brokers=Insurance

# Payments — Yahoo's "Credit Services" covers the card networks
industry.group.credit-services=Payments

# Financial data & exchanges
industry.group.financial-data-stock-exchanges=Financial Data

# industry.override.<SYMBOL> — a per-holding group that beats the feed. Only for where Yahoo is
# wrong about the business, and the drill-down keeps its raw value in a column alongside so an
# upstream reclassification stays visible instead of being silently overridden.
#
# LGEN: Yahoo files Legal & General under "Asset Management", which describes what it does with
# the float rather than what it sells. It is a life insurer and belongs with AV. and BRK.B.
industry.override.LGEN=Insurance
