# Investment-style classification (Allocation -> Breakdown, top block).
#
# Judgements only. Nothing here drifts: no per-symbol multiples, no as-of dates, no weights that
# need re-checking against a data source. Every number a position is scored on is fetched.
#
# Thresholds are ABSOLUTE, not percentile ranks within the portfolio. Ranking within a book that
# holds both deep-value European banks and 85%-growth semiconductors puts the mega-cap compounders
# mid-pack on both axes and files GOOG/MSFT/AMZN/V/MA under "neither" — an artefact of the peer
# set. See StyleClassifier's class javadoc.

# --- Value axis. A position is "cheap" when its weighted pass rate reaches score.threshold. ---
value.pe.max              = 16
value.evebitda.max        = 11
value.ps.max              = 2
value.divyield.min        = 0.025

value.pe.weight           = 1.0
value.evebitda.weight     = 0.8
value.ps.weight           = 0.8
value.divyield.weight     = 1.0

# --- Growth axis. Fractions, matching Yahoo's own scale (0.15 = 15%). ---
growth.revenue.min        = 0.15
growth.fcf.min            = 0.15
growth.earnings.min       = 0.15
growth.pecompression.min  = 0.15

growth.revenue.weight     = 1.0
growth.fcf.weight         = 0.8
# Both down-weighted deliberately, so that real top-line growth is close to necessary for the
# growth label rather than merely helpful. earningsGrowth is a single-quarter YoY figure and
# swings absurdly (Micron +1368%, Aviva +979%, L&G +507%); P/E compression fires for any cyclical
# whose earnings are recovering. Together at their original weights (0.5/0.7) the pair outvoted
# flat revenue and turned recovering banks into growth stocks -- see
# StyleClassifierTest.cyclicalWithFlatRevenueIsNotGrowth.
growth.earnings.weight    = 0.4
growth.pecompression.weight = 0.5

# Next-fiscal-year analyst estimates from Yahoo's earningsTrend module. These are the only growth
# inputs that survive negative trailing earnings -- Yahoo publishes no trailing P/E and no
# earningsGrowth for a loss-maker, which also disables the P/E-compression test, so Intel and
# Moderna were scoring on revenue growth alone and falling out as UNKNOWN.
#
# Forward revenue is the heavier of the two: revenue has a positive base by definition, so its
# growth rate always means what it says. Forward earnings growth never arrives at all for a
# loss-maker -- YahooQuoteSummaryFetcher.putForwardGrowth withholds it unless both the base and
# the estimate are positive. See StyleClassifierTest.shrinkingLossIsNotForwardGrowth.
#
# The weights follow the hierarchy the rest of this file already implies: REPORTED beats DERIVED
# beats ESTIMATED, and revenue beats earnings inside each tier. So forward revenue sits with P/E
# compression at 0.5, and forward earnings -- an estimate AND the noisy metric -- sits below
# trailing earnings growth at 0.25.
#
# These were briefly 0.8 / 0.4, which put 39% of the growth axis on analyst estimates and moved
# five positions that had nothing wrong with them: AAPL and AMZN out of Growth entirely, BNP/LMP/
# PHP out of Value+Growth. FY+1 estimates for mature large-caps cluster well under a bar set for
# trailing figures (Apple: +16.4% trailing revenue, +9.7% estimated), so at a full-weight vote the
# forward pair is a near-automatic fail for anything short of NVDA. That is a recalibration of what
# "growth" means for the whole book, not the availability fix this was meant to be. At 0.5/0.25 the
# estimates decide a position only when the reported metrics are absent -- which is the case the
# module was added for. See StyleClassifierTest.forwardEstimatesDoNotUnseatReportedGrowth.
growth.fwdrevenue.min     = 0.15
growth.fwdearnings.min    = 0.15
growth.fwdrevenue.weight  = 0.5
growth.fwdearnings.weight = 0.25

# Cut point for both axes, and the minimum number of metrics an axis needs before the position is
# scored at all (below it the position is UNKNOWN and listed by name rather than guessed at).
score.threshold           = 0.5
min.metrics               = 2

# --- Income overlay. Cuts ACROSS the style buckets, like the AI/Tech tile does across sectors. ---
income.divyield.min       = 0.025

# --- Funds. Placed on their aggregate P/E alone: Yahoo returns null for a fund's earnings growth
# on every fund held here, so there is no growth axis to score and they stay out of the 2x2. ---
fund.pe.value.max         = 18
fund.pe.growth.min        = 28

# --- Per-symbol overrides. Beat the feed; use for instruments no multiple can describe.
# Format: override.<SYMBOL> = <StyleBucket constant>
# Same instruments as sectors.properties overrides, for the same reason: bullion ETCs have no
# earnings, no sales and no yield, so every axis abstains. Without a home here they would land in
# UNKNOWN, which the UI presents as a data gap to go and fix rather than the deliberate holding
# they are. VGOV is a gilt fund and belongs with the rest of the fixed income.
override.PHGP             = NON_EQUITY
override.GBS              = NON_EQUITY
override.SGBX             = NON_EQUITY
override.VGOV             = FIXED_INCOME
