# Frozen violations live in archunit_store/ at the repo root, one file per rule.
freeze.store.default.path=archunit_store

# Deliberately false. The store is committed, and a run that cannot find it must fail loudly:
# creation-on-demand would silently re-freeze every violation the moment the store went missing,
# which is the same hole as a size cap with headroom behind it — a guard that can quietly stop
# guarding. Flip to true for one run only, when adding a rule that needs a new baseline.
freeze.store.default.allowStoreCreation=false

# True so a fixed violation drops out of the store by itself. This is the burn-down: the frozen
# set can shrink without anyone editing it, and cannot grow.
freeze.store.default.allowStoreUpdate=true
